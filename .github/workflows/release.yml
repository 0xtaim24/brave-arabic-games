name: release

# Push a tag like v1.0.1 and this builds the installer and creates a GitHub Release with:
#   - brave-Setup-x.y.z.exe  (the ready-to-install program, what players download)
#   - latest.yml + .blockmap (what the installed app reads to update itself)
# GitHub adds "Source code (zip / tar.gz)" to every release automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Build the patch engine and the voice/recognition helper
        shell: pwsh
        run: |
          python -m pip install -r engine/requirements.txt pyinstaller
          cd engine
          pyinstaller --noconfirm --onefile --name patcher --collect-all UnityPy patcher.py
          pyinstaller --noconfirm --onefile --name supertts --collect-all supertonic --collect-all onnxruntime --collect-all faster_whisper --collect-all ctranslate2 --collect-all av supertts.py
          Copy-Item dist/supertts.exe ../plugin/dist/supertts.exe

      - name: Install app dependencies
        run: npm ci

      - name: Build the installer
        run: npm run dist

      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: brave ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
