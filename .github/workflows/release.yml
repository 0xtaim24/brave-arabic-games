name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'App dependencies failed' }
          python -m pip install -r engine/requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE) { throw 'Speech dependencies failed' }

      - name: Check source, privacy exclusions and plugin hashes
        shell: pwsh
        run: |
          node --test characters.test.js update-state.test.js
          if ($LASTEXITCODE) { throw 'App tests failed' }
          python -m unittest discover -s engine -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Speech tests failed' }
          node scripts/verify-release.js
          if ($LASTEXITCODE) { throw 'Release source audit failed' }

      - name: Build the patch engine and speech helper
        shell: pwsh
        run: |
          Push-Location engine
          pyinstaller --noconfirm --onefile --name patcher --collect-all UnityPy patcher.py
          if ($LASTEXITCODE) { throw 'Patcher build failed' }
          pyinstaller --noconfirm --onefile --name supertts --collect-all supertonic --collect-all onnxruntime --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all transcribe_cpp supertts.py
          if ($LASTEXITCODE) { throw 'Speech helper build failed' }
          Copy-Item dist/supertts.exe ../plugin/dist/supertts.exe
          Pop-Location
          & ./scripts/prepare-stt-native.ps1
          & ./scripts/prepare-character-native.ps1

      - name: Build and audit installer and update feed
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          node scripts/verify-release.js dist
          if ($LASTEXITCODE) { throw 'Release artifact audit failed' }

      - name: Keep release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brave-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Upload assets to draft and publish completed release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'An already published release will not be overwritten.' }
          } else {
            gh release create $tag --verify-tag --title "brave $version" --notes-file RELEASE_NOTES.md --draft
            if ($LASTEXITCODE) { throw 'Draft release creation failed' }
          }
          gh release upload $tag "dist/brave-Setup-$version.exe" "dist/brave-Setup-$version.exe.blockmap" dist/latest.yml dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit $tag --draft=false --prerelease=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
